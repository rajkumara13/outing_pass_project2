<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Outing QR - Student Hostel Outpass System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="../css/all.min.css" rel="stylesheet">
    <!-- Global CSS Stylesheet -->
    <link href="../css/style.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .scan-container {
            max-width: 580px;
            width: 100%;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color) !important;
            background: rgba(0, 0, 0, 0.2);
        }

        #reader__scan_region {
            background: transparent !important;
        }

        #reader__dashboard {
            padding: 1.5rem !important;
            border-top: 1px solid var(--border-color) !important;
            background: rgba(17, 25, 40, 0.4) !important;
        }

        button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
        }

        #html5-qrcode-button-camera-start, #html5-qrcode-button-camera-stop {
            background: var(--accent-blue) !important;
            border: none !important;
            color: white !important;
            transition: all var(--transition-speed) ease;
        }
    </style>
</head>
<body>
    <div class="scan-container animate-fade-in">
        <div class="glass-card p-4 p-md-5 text-center">
            
            <div class="d-inline-flex align-items-center justify-content-center mb-3">
                <i class="fa-solid fa-person-walking-arrow-right fa-3x text-success" style="text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);"></i>
            </div>
            
            <h2 class="fw-bold mb-2">Scan Outing QR Code</h2>
            <p class="text-secondary mb-4">Gate Exit / Entry Verification Scanner</p>
            
            <!-- Scanner view container -->
            <div class="mb-4">
                <div id="reader" class="mx-auto"></div>
                <div id="scanner-status" class="mt-3 text-secondary" style="font-size: 0.95rem; font-weight: 500;">
                    Scanner is ready. Click below to start camera.
                </div>
            </div>

            <!-- Start/Stop scanner control buttons -->
            <div class="mb-4">
                <button id="btn-start-scanner" class="btn btn-primary-custom px-4 py-2.5">
                    <i class="fa-solid fa-camera me-2"></i>Start Webcam Scanner
                </button>
                <button id="btn-stop-scanner" class="btn btn-danger px-4 py-2.5 d-none">
                    <i class="fa-solid fa-circle-stop me-2"></i>Stop Scanner
                </button>
            </div>

            <div class="border-top border-secondary border-opacity-25 pt-4 my-4">
                <p class="text-secondary" style="font-size: 0.9rem;">Webcam not working? Enter Roll Number manually:</p>
                <form action="outing.html" method="GET" class="row g-2 justify-content-center">
                    <div class="col-sm-8 col-md-7">
                        <input type="text" name="roll_number" class="form-control text-center" placeholder="e.g. 23ADR045" required autocomplete="off" style="text-transform: uppercase;">
                    </div>
                    <div class="col-sm-4 col-md-3">
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">Submit</button>
                    </div>
                </form>
            </div>

            <div class="mt-3">
                <a href="../security/dashboard.html" class="text-secondary" style="font-size:0.9rem;">
                    <i class="fa-solid fa-arrow-left me-2"></i>Back to Security Console
                </a>
            </div>
        </div>
    </div>

    <!-- HTML5 QR Code library -->
    <script src="../js/html5-qrcode.min.js"></script>
    <!-- Scanner controller -->
    <script src="../js/scanner.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            initializeScanner('reader', 'outing.html');
        });
    </script>
</body>
</html>
