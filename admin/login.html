<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Hostel Outpass System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="../css/all.min.css" rel="stylesheet">
    <!-- Global and Login CSS -->
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
</head>
<body>
    <div class="login-container animate-fade-in">
        <div class="glass-card login-card">
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <h2>Admin Login</h2>
                <p>Sign in to access student settings and approvals</p>
            </div>

            <!-- Login form -->
            <form id="admin-login-form" class="needs-validation" novalidate>
                
                <!-- Error Alert Container -->
                <div id="error-alert-container"></div>

                <!-- Username Input -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autocomplete="username">
                    <label for="username"><i class="fa-solid fa-user me-2"></i>Username</label>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>

                <!-- Password Input -->
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                    <label for="password"><i class="fa-solid fa-key me-2"></i>Password</label>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="btn btn-primary-custom w-100 py-3 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin
                </button>

                <!-- Back to Home -->
                <div class="login-footer">
                    <a href="../index.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Portal Selection</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- Global Script -->
    <script src="../js/script.js"></script>
    <script>
        const loginForm = document.getElementById('admin-login-form');
        const alertBox = document.getElementById('error-alert-container');
        const submitBtn = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Logging in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: 'admin' })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('outpass_token', data.access_token);
                    localStorage.setItem('outpass_user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.innerHTML = `
                        <div class="alert alert-danger bg-opacity-10 border-danger text-light alert-dismissible fade show mb-3" role="alert">
                            <i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>${data.detail || data.message || 'Invalid username or password.'}
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin';
                }
            } catch (err) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger bg-opacity-10 border-danger text-light alert-dismissible fade show mb-3" role="alert">
                        <i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>Failed to reach server. Please check your connection.
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin';
            }
        });
    </script>
</body>
</html>
